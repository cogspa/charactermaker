[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/models/*"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/parts-manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
